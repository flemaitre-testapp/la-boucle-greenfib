<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La boucle Greenfib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  /* Palette Greenfib */
  --deep:#002956; --deep-d:#001A3A; --deep-t:#E3EAF1;
  --teal:#08B4C8; --teal-d:#067486; --teal-t:#DEF5F8;
  --sable:#F1DFC8; --sable-d:#D8BC93; --paille:#FFDD96; --paille-d:#A9762A; --paille-t:#FFF4DD;

  --paper:#FBF7F0; --card:#FFFFFF; --ink:var(--deep); --ink-soft:#5B7290;
  --green:var(--teal); --green-d:var(--teal-d); --green-t:var(--teal-t);
  --coral:var(--paille); --coral-d:var(--paille-d); --coral-t:var(--paille-t);
  --line:#E7DCC8; --line-s:#D8BC93; --radius:16px;
  --sans:'Nunito Sans',system-ui,-apple-system,sans-serif;
  --serif:'Quicksand','Nunito Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;padding-bottom:24px}
button{font-family:inherit;font-size:16px;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--green-d)}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.15;margin:0}
.hero-t{font-size:30px;font-weight:600;letter-spacing:-.5px}
p{margin:0}
.mut{color:var(--ink-soft)}
.sm{font-size:14px}
.xs{font-size:12.5px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;position:sticky;top:0;background:linear-gradient(var(--paper) 78%,transparent);z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.3px}
.knot{width:26px;height:26px;flex:0 0 auto;object-fit:contain}
.menu-btn{background:none;border:none;color:var(--ink);padding:6px;border-radius:10px;display:flex}
.menu{position:absolute;right:14px;top:52px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(44,32,22,.14);min-width:190px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:11px 12px;border-radius:10px;color:var(--ink)}
.menu button:hover{background:var(--green-t)}
.wrap{padding:8px 18px 0}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line-s);background:var(--card);color:var(--ink);font-weight:500;transition:transform .12s ease}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.cor{background:var(--coral);border-color:var(--coral);color:var(--deep)}
.btn.ghost{background:none;border:none;color:var(--green-d);font-weight:500;padding:10px}
.btn-row{display:flex;gap:10px}
.stack>*+*{margin-top:11px}
.back{display:inline-flex;gap:7px;align-items:center;background:none;border:none;color:var(--ink-soft);padding:8px 0;margin:4px 0}

/* cards / fields */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.field{display:block;margin-top:14px}
.field label{display:block;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid var(--line-s);border-radius:12px;background:#fff;color:var(--ink)}
.field textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus,.btn:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.consent{display:flex;gap:11px;align-items:flex-start;margin-top:16px;background:var(--green-t);padding:13px;border-radius:12px}
.consent input{margin-top:3px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--green)}
.err{color:var(--coral-d);font-size:13.5px;margin-top:8px;display:none}
.err.on{display:block}

/* photo picker */
.photo-pick{margin-top:14px;border:1.5px dashed var(--line-s);border-radius:14px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-soft);background:#fff;text-align:center;padding:14px;overflow:hidden;position:relative}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick input{position:absolute;inset:0;opacity:0}

/* stat pills */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat b{font-family:var(--serif);font-size:26px;font-weight:600;display:block;line-height:1}
.stat span{font-size:12.5px;color:var(--ink-soft)}

/* thread of meetings */
.thread{margin-top:18px;position:relative;padding-left:54px}
.thread:before{content:"";position:absolute;left:21px;top:4px;bottom:4px;width:3px;border-radius:3px;background:linear-gradient(var(--teal),var(--deep-t))}
.node{position:relative;margin-bottom:16px}
.node .dot{position:absolute;left:-54px;top:0;width:44px;height:44px;border-radius:50%;background:var(--teal);border:3px solid var(--paper);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;box-shadow:0 2px 8px rgba(0,41,86,.16)}
.node .dot img{width:100%;height:100%;object-fit:cover}
.node.start .dot{background:var(--deep)}
.node .m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.node .m .top-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.node .m .top-row b{font-family:var(--serif);font-size:16px}
.node .m .top-row .dte{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;flex:0 0 auto}
.node .m img{width:52px;height:52px;border-radius:11px;object-fit:cover;flex:0 0 auto;background:var(--green-t)}

/* wall */
.wall{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.wall figure{margin:0;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer}
.wall img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--green-t)}
.wall figcaption{padding:8px 10px;font-size:12px}
.wall .nm{font-weight:500}
.wall .mt{color:var(--ink-soft)}
.empty{text-align:center;color:var(--ink-soft);padding:26px 10px;font-size:14.5px}

/* map */
.map{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.map svg{display:block;width:100%;height:auto;background:var(--deep-t)}
.mland{fill:#D3E0EC;stroke:var(--line-s);stroke-width:1}
.mpt{fill:var(--green);stroke:#fff;stroke-width:2;cursor:pointer}
.mpt.you{fill:var(--coral)}
.mchain{fill:none;stroke:var(--coral);stroke-width:2.4;stroke-dasharray:3 4;opacity:.85}
.mpop{padding:12px 14px;border-top:1px solid var(--line);display:none;gap:12px;align-items:center}
.mpop.on{display:flex}
.mpop img{width:54px;height:54px;border-radius:11px;object-fit:cover}

/* chips / section headers */
.eyebrow{font-family:var(--serif);font-size:20px;font-weight:600;margin-top:26px}
.steps{margin-top:12px}
.step{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.step .n{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--green);flex:0 0 26px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--green-t);color:var(--green-d);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500}

/* transmit */
.qrbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;margin-top:16px}
#qr{width:180px;height:180px;display:flex;align-items:center;justify-content:center}
#qr img,#qr canvas{width:180px!important;height:180px!important}
.code{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:2px;color:var(--paille-d);background:var(--coral-t);border-radius:12px;padding:9px 18px;margin-top:16px}

/* confirm */
.confirm{text-align:center;padding:30px 12px}
.seal{width:82px;height:82px;margin:0 auto 6px}
.seal circle{fill:none;stroke:var(--green);stroke-width:5}
.seal .ring{stroke-dasharray:245;stroke-dashoffset:245;animation:draw .7s ease forwards}
.seal .tick{stroke:var(--green);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.big-num{font-family:var(--serif);font-size:56px;font-weight:600;color:var(--green);line-height:1}
@media(prefers-reduced-motion:reduce){.seal .ring,.seal .tick{animation:none;stroke-dashoffset:0}}

.divider{height:1px;background:var(--line);margin:20px 0}
.note{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5}
.footer{padding:26px 18px 10px;color:var(--ink-soft);font-size:12px;line-height:1.6}
.footer a{color:var(--green-d)}
.orsep{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:13px;margin:16px 0}
.orsep:before,.orsep:after{content:"";height:1px;background:var(--line);flex:1}
.banner{background:var(--coral-t);color:var(--coral-d);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-top:12px}
.hide{display:none}

/* real map (Leaflet) */
.mapbox{height:260px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);margin-top:14px;background:var(--deep-t)}
.mapbox .leaflet-popup-content{font-family:var(--sans);font-size:13px}

/* cup number entry */
.cupzone{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:22px;text-align:center}
.cupzone label{display:block;font-weight:600;font-family:var(--serif);font-size:17px;margin-bottom:10px;color:var(--deep)}
.cupinput{width:100%;padding:16px;border:2px solid var(--line-s);border-radius:14px;background:#fff;color:var(--deep);font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:3px;text-align:center}
.cupinput:focus{outline:2px solid var(--teal);outline-offset:2px;border-color:var(--teal)}
.cuphint{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.summary-card{background:var(--deep-t);border-radius:14px;padding:14px;margin-top:14px;text-align:left}
.summary-card b{font-family:var(--serif)}
</style>

<script>
/* ---------- persistence layer (server-side PHP API — data/photos stored on server) ---------- */
async function getLoop(id){ try{ const r=await fetch('api/get.php?id='+encodeURIComponent(id)); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
async function putLoop(l){ try{ await fetch('api/save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(l)}); }catch(e){} }
async function allLoops(){ try{ const r=await fetch('api/list.php'); if(!r.ok) return []; return await r.json(); }catch(e){ return []; } }
async function uploadPhoto(blob){
  if(!blob) return null;
  try{
    const fd=new FormData(); fd.append('photo',blob,'photo.jpg');
    const r=await fetch('api/upload.php',{method:'POST',body:fd});
    if(!r.ok) return null;
    const j=await r.json();
    return j.url||null;
  }catch(e){ return null; }
}


/* ---------- helpers ---------- */
const rnd=(n)=>Math.random().toString(36).slice(2,2+n);
const uid=()=>Date.now().toString(36)+rnd(4);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{try{return new Date(d+'T00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}};
const escapeHtml=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s_]+/g,'-').replace(/-+/g,'-');
const normCup=v=>(v||'').toUpperCase().replace(/\s+/g,'').trim();

const GAZ={ 'paris':[48.86,2.35],'rennes':[48.11,-1.68],'nantes':[47.22,-1.55],'brest':[48.39,-4.49],'quimper':[47.99,-4.10],'lorient':[47.75,-3.37],'vannes':[47.66,-2.76],'saint-malo':[48.65,-2.01],'st-malo':[48.65,-2.01],'ploermel':[47.93,-2.40],'josselin':[47.95,-2.55],'redon':[47.65,-2.08],'neant-sur-yvel':[47.98,-2.31],'lyon':[45.76,4.84],'marseille':[43.30,5.37],'bordeaux':[44.84,-0.58],'toulouse':[43.60,1.44],'lille':[50.63,3.06],'strasbourg':[48.58,7.75],'nice':[43.70,7.27],'montpellier':[43.61,3.88],'nancy':[48.69,6.18],'grenoble':[45.19,5.72],'angers':[47.47,-0.55],'le mans':[48.00,0.20],'tours':[47.39,0.69],'caen':[49.18,-0.37],'rouen':[49.44,1.10],'reims':[49.26,4.03],'dijon':[47.32,5.04],'clermont-ferrand':[45.78,3.09],'pau':[43.30,-0.37],'la rochelle':[46.16,-1.15],'saint-brieuc':[48.51,-2.77],'morlaix':[48.58,-3.83],'concarneau':[47.87,-3.92],'auray':[47.67,-2.98],'pontivy':[48.07,-2.96],'fougeres':[48.35,-1.20],'vitre':[48.12,-1.21],'dinan':[48.45,-2.05],'carnac':[47.58,-3.08],'perros-guirec':[48.81,-3.44],'douarnenez':[48.09,-4.33],'auvers-le-hamon':[47.90,-0.28],'sable-sur-sarthe':[47.83,-0.33] };
const GAZ_LABELS = Object.keys(GAZ).filter(k=>k!=='st-malo').map(k=>k.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('-'));
function cityDatalist(id){ return `<datalist id="${id}">${GAZ_LABELS.map(l=>`<option value="${l}">`).join('')}</datalist>`; }
const cityCoordCache={};
function shortLabel(it){ const a=it.address||{}; const city=a.city||a.town||a.village||a.municipality||a.hamlet||(it.display_name?it.display_name.split(',')[0]:''); const country=a.country||''; return country?`${city}, ${country}`:city; }
async function nominatimSearch(q,limit){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=${limit}&addressdetails=1`,{headers:{'Accept':'application/json'}});
    if(!r.ok) return [];
    const j=await r.json();
    if(!j||!j.length) return [];
    return j.map(it=>({lat:parseFloat(it.lat),lng:parseFloat(it.lon),label:shortLabel(it)}));
  }catch(e){ return []; }
}
async function geocode(city){
  const k=norm(city);
  if(GAZ[k]) return {lat:GAZ[k][0],lng:GAZ[k][1],approx:false};
  for(const g in GAZ){ if(k&&(g.includes(k)||k.includes(g))) return {lat:GAZ[g][0],lng:GAZ[g][1],approx:false}; }
  if(cityCoordCache[k]) return {lat:cityCoordCache[k].lat,lng:cityCoordCache[k].lng,approx:false};
  const hits=await nominatimSearch(city,1);
  if(hits.length){ cityCoordCache[k]={lat:hits[0].lat,lng:hits[0].lng}; return {lat:hits[0].lat,lng:hits[0].lng,approx:false}; }
  return null;
}
let cityDebounce=null;
function wireCitySuggest(inputId,listId){
  const inp=document.getElementById(inputId); if(!inp) return;
  inp.addEventListener('input',()=>{
    clearTimeout(cityDebounce);
    const q=inp.value.trim();
    if(q.length<3) return;
    cityDebounce=setTimeout(async()=>{
      const results=await nominatimSearch(q,5);
      results.forEach(r=>{ cityCoordCache[norm(r.label)]={lat:r.lat,lng:r.lng}; });
      const dl=document.getElementById(listId);
      if(dl) dl.innerHTML = GAZ_LABELS.map(l=>`<option value="${l}">`).join('') + results.map(r=>`<option value="${escapeHtml(r.label)}">`).join('');
    },450);
  });
}
function nearestCityLabel(lat,lng){ let best=null,bestD=Infinity; for(const k in GAZ){ if(k==='st-malo')continue; const [glat,glng]=GAZ[k]; const d=(glat-lat)**2+(glng-lng)**2; if(d<bestD){bestD=d;best=k;} } return best?best.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('-'):''; }

function resizeImage(file,max,q){ return new Promise((res)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ let{width:w,height:h}=img; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc);h=Math.round(h*sc); const c=document.createElement('canvas');c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); const dataURL=c.toDataURL('image/jpeg',q); c.toBlob(blob=>res({dataURL,blob}),'image/jpeg',q); }; img.src=r.result; }; r.readAsDataURL(file); }); }

const baseURL=()=>location.origin+location.pathname;
function qs(){ const p=new URLSearchParams(location.search); return {loop:p.get('loop')}; }

/* ---------- app state ---------- */
let S={ pending:null }; // pending photo dataurl
const V=document.getElementById('view');
function render(html){ V.innerHTML=html; window.scrollTo(0,0); }

/* ---------- boot / router ---------- */
async function boot(){
  const q=qs();
  if(q.loop){ return viewLoop(q.loop); }
  return homeDefault();
}

/* ---------- screen: home ---------- */
async function homeDefault(){
  const loops=await allLoops(); const st=stats(loops);
  render(`
  <h1 class="hero-t">Un gobelet. Un café.<br>Une rencontre.<br><span style="color:var(--teal)">Puis une autre.</span></h1>
  <p class="mut" style="margin-top:12px">Chaque gobelet Greenfib® porte un numéro. Ce numéro raconte une histoire&nbsp;: celle de toutes les personnes qui, un café après l’autre, se le sont transmis. En le suivant, vous ajoutez votre rencontre à la boucle — et vous la faites continuer.</p>
  <p class="mut sm" style="margin-top:14px">📍 Numéro du gobelet → 🖊️ prénom, lieu, photo → ☕ vous le transmettez à la suite.</p>
  <div class="cupzone">
    <label for="cupnum">Quel est le numéro de votre gobelet&nbsp;?</label>
    <input id="cupnum" class="cupinput" placeholder="N° 042" autocomplete="off" inputmode="text">
    <div class="err" id="cupErr"></div>
    <div class="stack" style="margin-top:14px"><button class="btn pri" id="cupGo">Continuer</button></div>
    <div class="cuphint">Le numéro est inscrit sur le gobelet, près du logo Greenfib®.</div>
  </div>
  <div class="stack" style="margin-top:16px"><button class="btn ghost" data-go="explore">Découvrir les boucles en circulation →</button></div>
  ${st.cafes>0?`<div class="stats" style="margin-top:22px">
    <div class="stat"><b>${st.loops}</b><span>boucles en circulation</span></div>
    <div class="stat"><b>${st.cafes}</b><span>cafés partagés</span></div>
    <div class="stat"><b>${st.cities}</b><span>villes atteintes</span></div>
    <div class="stat"><b>${st.longest}</b><span>plus longue chaîne</span></div>
  </div>`:''}
  <div class="eyebrow">Greenfib® &amp; le réemploi</div>
  <p class="mut sm" style="margin-top:8px">Le gobelet est fabriqué dans une matière <b>100% biosourcée</b>, durable, pensée pour l’usage répété. L’idée n’est pas seulement la matière&nbsp;: c’est le passage d’un objet possédé puis jeté à un objet qui circule, crée des rencontres et s’inscrit dans le temps.</p>
  `);
  document.getElementById('cupGo').onclick=()=>checkCup();
  document.getElementById('cupnum').addEventListener('keydown',e=>{ if(e.key==='Enter') checkCup(); });
}

async function checkCup(){
  const err=document.getElementById('cupErr');
  const raw=val('cupnum');
  if(!raw) return showErr(err,'Indiquez le numéro inscrit sur le gobelet.');
  const number=normCup(raw);
  const loops=await allLoops();
  const existing=loops.find(l=>l.status==='active'&&l.cupNumber===number);
  registerScreen(number, existing||null);
}

/* ---------- screen: register (new loop OR continue existing) ---------- */
function registerScreen(number, existing){
  const isNew=!existing;
  const summary = existing ? `<div class="summary-card"><b>${existing.meetings.length+1}</b> maillon${existing.meetings.length?'s':''} déjà écrit${existing.meetings.length?'s':''}.<br>Parti de <b>${escapeHtml(existing.startCity)}</b>${existing.meetings.length?`, dernier arrêt à <b>${escapeHtml(existing.meetings[existing.meetings.length-1].city)}</b>`:''}.</div>` : '';
  render(`
  <button class="back" data-go="home">← Retour</button>
  <div class="chip">${isNew?'☕ Nouveau parcours':'🔗 Parcours en cours'}</div>
  <h1 style="margin-top:12px">Gobelet n°${escapeHtml(number)}</h1>
  ${summary}
  <p class="mut sm" style="margin-top:10px">${isNew?'Vous êtes la première personne à écrire son histoire.':'Ajoutez votre rencontre à la suite.'}</p>
  <label class="photo-pick" id="pick"><span style="font-size:26px">📷</span><span class="sm">Une photo avec le gobelet, ici et maintenant</span><input type="file" accept="image/*" capture="environment" id="f_photo"></label>
  <div class="field"><label>Votre prénom</label><input id="f_name" placeholder="Camille" autocomplete="given-name"></div>
  <div class="field"><label>Ville ou lieu où vous êtes</label><input id="f_city" list="cityList" placeholder="Rennes" autocomplete="off">${cityDatalist('cityList')}
    <button type="button" class="btn ghost" id="geoBtn" style="margin-top:8px;padding:8px 4px;width:auto">📍 Utiliser ma position</button>
    <div id="citySuggestions" style="margin-top:6px"></div>
  </div>
  <div class="field"><label>Une légende (facultatif)</label><textarea id="f_cap" placeholder="Un café sur le port, entre deux averses."></textarea></div>
  <label class="consent"><input type="checkbox" id="f_consent"><span class="sm">J’autorise la publication de cette photo et de mon prénom. Je confirme avoir l’accord des personnes présentes — et l’autorisation d’un parent pour tout mineur visible.</span></label>
  <div class="err" id="err"></div>
  <div class="stack" style="margin-top:18px"><button class="btn pri" id="save">${isNew?'Lancer la boucle':'Valider ma rencontre'}</button></div>
  `);
  hookPhoto('pick','f_photo');
  S.pendingGeo=null;
  document.getElementById('f_city').addEventListener('input',()=>{S.pendingGeo=null; const box=document.getElementById('citySuggestions'); if(box) box.innerHTML='';});
  wireCitySuggest('f_city','cityList');
  document.getElementById('geoBtn').onclick=useGeoloc;
  document.getElementById('save').onclick=()=>saveRegistration(number, existing?existing.pubId:null);
}
async function saveRegistration(number,existingPubId){
  const err=document.getElementById('err');
  const name=val('f_name'), city=val('f_city'), cap=val('f_cap');
  const consent=document.getElementById('f_consent').checked;
  const btn=document.getElementById('save');
  const resetBtn=()=>{ if(btn){btn.disabled=false;btn.textContent=existingPubId?'Valider ma rencontre':'Lancer la boucle';} };
  if(!name) return showErr(err,'Indiquez votre prénom.');
  if(!city) return showErr(err,'Indiquez une ville ou un lieu.');
  if(!consent) return showErr(err,'Cochez le consentement pour publier votre rencontre.');
  if(btn){btn.disabled=true;btn.textContent='Vérification…';}
  const g = S.pendingGeo ? {lat:S.pendingGeo.lat, lng:S.pendingGeo.lng, approx:false} : await geocode(city);
  if(!g){ resetBtn(); return showCitySuggestions(city); }
  document.getElementById('citySuggestions').innerHTML='';
  if(btn) btn.textContent='Enregistrement…';
  const photoUrl = await uploadPhoto(S.pendingBlob);
  S.pending=null; S.pendingBlob=null; S.pendingGeo=null;
  let loop;
  if(existingPubId){
    loop=await getLoop(existingPubId);
    if(!loop||loop.status!=='active'){ resetBtn(); return showErr(err,'Ce parcours n’est plus actif.'); }
    const meeting={id:uid(),name,city,lat:g.lat,lng:g.lng,approx:g.approx,date:today(),caption:cap,photo:photoUrl,hidden:false,consent:true,createdAt:Date.now()};
    loop.meetings.push(meeting);
  }else{
    loop={ pubId:uid(), cupNumber:number, createdAt:Date.now(), status:'active', starter:name, startCity:city, startLat:g.lat, startLng:g.lng, startPhoto:photoUrl, meetings:[] };
  }
  await putLoop(loop);
  confirmScreen(loop);
}
async function showCitySuggestions(city){
  const err=document.getElementById('err');
  showErr(err,'Cette ville n’est pas reconnue. Choisissez une suggestion :');
  const box=document.getElementById('citySuggestions'); if(!box) return;
  box.innerHTML='<span class="xs mut">Recherche…</span>';
  const results=await nominatimSearch(city,5);
  results.forEach(r=>{ cityCoordCache[norm(r.label)]={lat:r.lat,lng:r.lng}; });
  if(!results.length){ box.innerHTML='<span class="xs mut">Aucune suggestion trouvée — vérifiez l’orthographe.</span>'; return; }
  box.innerHTML=results.map(r=>`<button type="button" class="chip" style="margin:4px 6px 0 0;cursor:pointer;border:none" data-city="${escapeHtml(r.label)}">${escapeHtml(r.label)}</button>`).join('');
  box.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{
    document.getElementById('f_city').value=b.dataset.city;
    box.innerHTML='';
    err.classList.remove('on');
  });
}

async function doResetData(){
  const err=document.getElementById('resetErr');
  const code=val('resetCode');
  if(!code) return showErr(err,'Indiquez le code de réinitialisation.');
  if(!confirm('Supprimer définitivement toutes les boucles, rencontres et photos ? Cette action est irréversible.')) return;
  try{
    const r=await fetch('api/reset.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    const j=await r.json();
    if(!r.ok||!j.ok) return showErr(err, j.error==='invalid_code' ? 'Code incorrect.' : 'Échec de la réinitialisation.');
    adminPanel();
  }catch(e){ showErr(err,'Erreur réseau — réessayez.'); }
}
function adminLoop(l){
  return `<div class="card" style="margin-top:14px;padding:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div><b class="sm">Gobelet n°${escapeHtml(l.cupNumber)}</b><div class="xs mut">${escapeHtml(l.starter)} · ${escapeHtml(l.startCity)} · ${l.meetings.length+1} maillons${l.status==='suspended'?' · <span style="color:var(--paille-d)">suspendue</span>':''}</div></div>
      <button class="btn" style="width:auto;padding:8px 12px;font-size:13px" data-act="${l.status==='suspended'?'restore':'suspend'}" data-loop="${l.pubId}">${l.status==='suspended'?'Restaurer':'Suspendre'}</button>
    </div>
    ${l.meetings.map((m,i)=>`<div style="display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0;margin-top:9px">

      <div style="flex:1;min-width:0"><div class="sm">${escapeHtml(m.name)} ${m.hidden?'<span class="xs" style="color:var(--paille-d)">(masquée)</span>':''}</div><div class="xs mut">${escapeHtml(m.city)} · ${fmtDate(m.date)}</div></div>
      <button class="btn" style="width:auto;padding:6px 9px;font-size:12px" data-act="edit" data-loop="${l.pubId}" data-mid="${m.id}">Corriger</button>
      <button class="btn" style="width:auto;padding:6px 9px;font-size:12px" data-act="${m.hidden?'show':'hide'}" data-loop="${l.pubId}" data-mid="${m.id}">${m.hidden?'Afficher':'Masquer'}</button>
      <button class="btn" style="width:auto;padding:6px 9px;font-size:12px;color:var(--paille-d)" data-act="del" data-loop="${l.pubId}" data-mid="${m.id}">Suppr.</button>
    </div>`).join('')}

async function adminAct(act,pubId,mid){
  const loop=await getLoop(pubId); if(!loop) return;
  if(act==='suspend')loop.status='suspended';
  else if(act==='restore')loop.status='active';
  else{ const m=loop.meetings.find(x=>x.id===mid); if(!m)return;
    if(act==='hide')m.hidden=true;
    else if(act==='show')m.hidden=false;
    else if(act==='del')loop.meetings=loop.meetings.filter(x=>x.id!==mid);
    else if(act==='edit'){ const city=prompt('Ville :',m.city); if(city!==null){m.city=city;const g=await geocode(city);m.lat=g.lat;m.lng=g.lng;} const name=prompt('Prénom :',m.name); if(name!==null)m.name=name; const date=prompt('Date (AAAA-MM-JJ) :',m.date); if(date!==null)m.date=date; }
  }
  await putLoop(loop); adminPanel();
}
function exportData(loops){
  const clean=loops.map(l=>({...l,meetings:l.meetings.map(m=>({...m,photo:m.photo?'[image]':null}))}));
  const blob=new Blob([JSON.stringify(clean,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='boucle-cafe-export.json';a.click();
}

/* ---------- real map (Leaflet + OpenStreetMap) ---------- */
let currentMap=null;
function destroyMap(){ if(currentMap){ try{currentMap.remove();}catch(e){} currentMap=null; } }
function loopColor(i){ const palette=['#08B4C8','#F2A93B','#7C5CFC','#E2574C','#2E9E6B','#C2469A','#3B82C4','#D98E04']; return palette[i%palette.length]; }
function paintMap(elId, loops, focusPubId){
  destroyMap();
  const el=document.getElementById(elId);
  if(!el || typeof L==='undefined'){ if(el) el.innerHTML='<div class="empty" style="padding:40px 10px">Carte indisponible hors ligne.</div>'; return; }
  const map=L.map(elId,{scrollWheelZoom:false});
  currentMap=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
  const bounds=[];
  loops.forEach((l,li)=>{
    const color=loops.length>1?loopColor(li):'#08B4C8';
    const chain=[{lat:l.startLat,lng:l.startLng,label:l.starter,city:l.startCity,date:null},
      ...l.meetings.filter(m=>!m.hidden).map(m=>({lat:m.lat,lng:m.lng,label:m.name,city:m.city,date:m.date}))];
    chain.forEach(pt=>bounds.push([pt.lat,pt.lng]));
    if(chain.length>1){
      L.polyline(chain.map(p=>[p.lat,p.lng]),{color,weight:3,dashArray:'4 7',opacity:.9}).addTo(map);
    }
    chain.forEach((pt,i)=>{
      L.circleMarker([pt.lat,pt.lng],{radius:7,color:'#fff',weight:2,fillColor:i===0?'#002956':color,fillOpacity:1})
        .addTo(map)
        .bindPopup(`<b>${escapeHtml(pt.label)}</b><br>${escapeHtml(pt.city)}${pt.date?' · '+fmtDate(pt.date):''}<br><a href="#" onclick="viewLoop('${l.pubId}');return false;">Voir cette boucle →</a>`);
    });
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[26,26],maxZoom:11});
  else map.setView([46.7,2.4],5);
}

/* ---------- stats ---------- */
function stats(loops){
  const act=loops.filter(l=>l.status==='active');
  let cafes=0,cities=new Set(),people=new Set(),longest=0;
  loops.forEach(l=>{ if(l.status==='suspended')return; cities.add(norm(l.startCity)); people.add(norm(l.starter)); const vis=l.meetings.filter(m=>!m.hidden); cafes+=vis.length; vis.forEach(m=>{cities.add(norm(m.city));people.add(norm(m.name));}); longest=Math.max(longest,vis.length+1); });
  return {loops:act.length,cafes,cities:cities.size,people:people.size,longest};
}

/* ---------- small utils ---------- */
function val(id){return (document.getElementById(id)?.value||'').trim();}
function showErr(el,msg){el.textContent=msg;el.classList.add('on');el.scrollIntoView({block:'center',behavior:'smooth'});}
function hookPhoto(pickId,inputId){ const inp=document.getElementById(inputId); inp.onchange=async()=>{ if(!inp.files[0])return; const {dataURL,blob}=await resizeImage(inp.files[0],900,0.75); S.pending=dataURL; S.pendingBlob=blob; const pick=document.getElementById(pickId); pick.innerHTML=`<img src="${dataURL}" alt="aperçu">`+pick.querySelector('input').outerHTML; hookPhoto(pickId,inputId); }; }
function useGeoloc(){
  const err=document.getElementById('err');
  if(!navigator.geolocation) return showErr(err,'La géolocalisation n’est pas disponible sur cet appareil.');
  const btn=document.getElementById('geoBtn'); if(btn){btn.disabled=true;btn.textContent='Localisation…';}
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat,longitude:lng}=pos.coords;
    S.pendingGeo={lat,lng};
    const label=nearestCityLabel(lat,lng);
    const cityInput=document.getElementById('f_city');
    if(cityInput) cityInput.value=label;
    if(btn){btn.disabled=false;btn.textContent='📍 Position utilisée ✓';}
  },()=>{
    if(btn){btn.disabled=false;btn.textContent='📍 Utiliser ma position';}
    showErr(err,'Impossible d’obtenir votre position (autorisation refusée ou indisponible).');
  },{enableHighAccuracy:true,timeout:8000});
}

/* ---------- navigation wiring ---------- */
const menu=document.getElementById('menu');
document.getElementById('menuBtn').onclick=(e)=>{e.stopPropagation();menu.classList.toggle('hide');};
document.addEventListener('click',(e)=>{ if(!menu.contains(e.target)&&e.target.id!=='menuBtn')menu.classList.add('hide'); });
document.addEventListener('click',(e)=>{
  const t=e.target.closest('[data-go]'); if(!t)return; menu.classList.add('hide');
  const go=t.dataset.go, lp=t.dataset.loop;
  if(go==='home')boot();
  else if(go==='explore')explore();
  else if(go==='admin')adminGate();
  else if(go==='viewloop')viewLoop(lp);
});
document.getElementById('lnkRetrait').onclick=(e)=>{e.preventDefault();alert('Prototype : la demande de retrait serait transmise à la modération, qui masque la photo concernée sous 48 h.');};
document.getElementById('lnkPriv').onclick=(e)=>{e.preventDefault();alert('Prototype : politique de confidentialité — publication des seuls prénoms, ville approximative, consentement explicite, retrait sur demande, hébergement UE en production.');};

boot();
</script>
